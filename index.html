<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eurovision 2026 · Vienna</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F3F3F3;--card:#fff;--dark:#242424;--muted:#707070;--light:#A0A0A0;
  --border:#EFEFEF;--coral:#E0533D;--rose:#E78C9D;--yellow:#EED868;
  --lav:#9DA7D0;--blue:#377CC8;--teal:#469B88;--ok:#53D258;--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--dark);font-family:'Inter',sans-serif;overflow:hidden;max-width:100vw}
#app{height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.screens{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;display:none;flex-direction:column;background:var(--bg)}
.screen.active{display:flex}

/* TYPE */
.jk{font-family:'Plus Jakarta Sans',sans-serif}
.h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.5px;color:var(--dark)}
.h2{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:18px;color:var(--dark)}
.h3{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:15px;color:var(--dark)}
.sm{font-size:12px;color:var(--muted)}
.xs{font-size:10px;color:var(--light);font-weight:600;text-transform:uppercase;letter-spacing:.5px}

/* LAYOUT */
.abar{background:var(--bg);padding:44px 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.abar-sm{background:var(--bg);padding:44px 16px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.pad{padding:0 16px 24px;flex:1;overflow-y:auto}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.card-dark{background:var(--dark);border-radius:var(--r);padding:16px;margin-bottom:8px;position:relative;overflow:hidden}
.card-col{border-radius:var(--r);padding:14px;margin-bottom:8px;position:relative;overflow:hidden;cursor:pointer}

/* FLAG */
.fc{width:42px;height:42px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
.fc-sm{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;overflow:hidden}
.fc-lg{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;margin:8px auto}
.fc img,.fc-sm img,.fc-lg img{width:100%;height:100%;object-fit:cover;display:block}

/* ROW */
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}

/* AVATAR */
.av{width:32px;height:32px;border-radius:50%;background:var(--coral);display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}

/* BTN */
.btn{width:100%;padding:14px;border-radius:var(--r);font-size:15px;font-weight:600;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.97);opacity:.9}
.btn:disabled{opacity:.35;cursor:default}
.btn-dk{background:var(--dark);color:#fff}
.btn-out{background:transparent;border:1.5px solid var(--border);color:var(--dark);margin-top:8px}
.btn-col{background:var(--coral);color:#fff}

/* PILL */
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600}
.pill-dk{background:var(--dark);color:#fff}
.pill-lt{background:var(--bg);color:var(--dark)}
.pill-y{background:var(--yellow);color:var(--dark)}

/* PROGRESS */
.prog{height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:10px}
.prog-f{height:5px;border-radius:3px;background:var(--yellow)}

/* SLOT */
.slot{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);padding:10px 12px;margin-bottom:6px}
.slot-e{border:1.5px dashed var(--border);background:transparent;opacity:.5}
.sn{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;font-family:'Plus Jakarta Sans',sans-serif}

/* SLIDER */
.sl-card{border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.sl-lbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sl-val{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:700;color:#fff}
.sl-track{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.3)}
.sl-fill{height:6px;border-radius:3px;background:rgba(255,255,255,.8)}
.sl-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2.5px solid rgba(0,0,0,.15);position:absolute;top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sl-range{width:100%;opacity:0;position:absolute;inset:-8px 0;height:22px;cursor:pointer}
.sl-mm{display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:rgba(255,255,255,.45)}

/* SHEET */
.sh-ov{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:none}
.sh-ov.open{display:block}
.b-sh{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;background:var(--card);border-radius:20px 20px 0 0;border-top:1px solid var(--border);padding:10px 0 40px;z-index:201;transition:transform .28s cubic-bezier(.4,0,.2,1);max-height:90dvh;overflow-y:auto}
.b-sh.open{transform:translateX(-50%) translateY(0)}
.sh-handle{width:32px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.sh-pad{padding:0 16px}

/* COUNTRY OPT */
.c-opt{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}
.c-opt:active{background:var(--bg)}
.c-opt.sel{background:var(--coral);border-radius:var(--r);margin:0 8px;padding:10px}
.c-opt.sel .h3,.c-opt.sel .sm{color:#fff}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;border-radius:20px;padding:10px 18px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:90vw}
.toast.show{opacity:1}

/* REVEAL */
.rv-card{border-radius:16px;padding:24px 16px;text-align:center;margin-bottom:10px;position:relative;overflow:hidden}
.rv-place{font-family:'Plus Jakarta Sans',sans-serif;font-size:60px;font-weight:800;color:#fff;line-height:1;letter-spacing:-2px}

/* PREDICT */
.match{background:#d4f5dd;border:2px solid var(--ok);border-radius:var(--r);padding:8px 10px}
.partial-match{background:#e8f0fd;border:2px solid var(--blue);border-radius:var(--r);padding:8px 10px}
.no-match{opacity:.35}
.winner{background:linear-gradient(135deg,var(--yellow),#ffb300);border-radius:var(--r);padding:16px;text-align:center;margin-bottom:10px}

/* ADMIN */
.adm-sec{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px}
.adm-ttl{font-size:10px;font-weight:700;color:var(--light);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px}
.adm-tog{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.adm-tog:last-child{border-bottom:none;padding-bottom:0}
.sw{width:42px;height:24px;border-radius:12px;background:var(--border);border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.sw.on{background:var(--coral)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on::after{transform:translateX(18px)}
.ei{flex:1;background:var(--bg);border:none;border-radius:8px;padding:8px 10px;font-size:13px;color:var(--dark);font-family:'Inter',sans-serif;outline:none}
.ei:focus{box-shadow:0 0 0 2px var(--coral)}
.er{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.add-row{display:flex;gap:6px;margin-top:8px}
.add-btn{background:var(--dark);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
.del-btn{background:none;border:none;color:var(--light);font-size:18px;cursor:pointer;padding:4px;flex-shrink:0}

/* REVEAL WAITING */
.rv-wait{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:32px;text-align:center}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.93)}}
@keyframes cfFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100dvh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div id="app"><div class="screens" id="screens"></div></div>
<div class="toast" id="toast"></div>
<div class="sh-ov" id="sh-ov" onclick="closeSheet()"></div>
<div class="b-sh" id="b-sh"></div>
<script>
const SUPABASE_URL='https://dhjhizvoqfqajjhehysv.supabase.co';
const SUPABASE_KEY='sb_publishable_yC4QV0qGv2jrLGksKz--rw_phRdo-Tq';
const ADMIN='Евгений';

/* ── MODES ──
   mode = 'vote'    → все голосуют
   mode = 'reveal'  → все смотрят reveal (листает только админ)
   mode = 'predict' → все видят предикты
*/

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
let me=null,countries=[],myVotes={},allVotes={},settings={},predictions={},off5=[];
let _mode='vote'; /* текущий режим */

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

/* ISO map for flag images */
const ISO={'Австрия':'at','Албания':'al','Армения':'am','Австралия':'au','Азербайджан':'az','Бельгия':'be','Швейцария':'ch','Кипр':'cy','Чехия':'cz','Дания':'dk','Эстония':'ee','Финляндия':'fi','Франция':'fr','Великобритания':'gb','Грузия':'ge','Германия':'de','Греция':'gr','Хорватия':'hr','Израиль':'il','Италия':'it','Литва':'lt','Люксембург':'lu','Молдова':'md','Мальта':'mt','Норвегия':'no','Польша':'pl','Португалия':'pt','Румыния':'ro','Сербия':'rs','Швеция':'se','Сан-Марино':'sm','Словения':'si','Украина':'ua','Черногория':'me','Болгария':'bg','Латвия':'lv','Нидерланды':'nl','Испания':'es','Ирландия':'ie','Исландия':'is'};

function flagEl(name,size){
  const code=ISO[name];
  const cls=size==='lg'?'fc-lg':size==='sm'?'fc-sm':'fc';
  if(code)return'<div class="'+cls+'"><img src="https://flagcdn.com/w80/'+code+'.png" alt="'+esc(name)+'"></div>';
  return'<div class="'+cls+'">🏳️</div>';
}

function toast(msg,dur=2500){const e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),dur)}
function openSheet(){$('sh-ov').classList.add('open');$('b-sh').classList.add('open')}
function closeSheet(){$('sh-ov').classList.remove('open');$('b-sh').classList.remove('open')}
function setScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));const e=$(id);if(e){e.classList.add('active');e.scrollTop=0}}
function remScreen(id){const e=$(id);if(e)e.remove()}

/* ═══════════════════════════════
   INIT
═══════════════════════════════ */
async function init(){
  me=localStorage.getItem('esc_user');
  const[cR,sR,vR,pR]=await Promise.all([
    sb.from('esc_countries').select('*').order('order_num'),
    sb.from('esc_settings').select('*'),
    sb.from('esc_votes').select('*'),
    sb.from('esc_predictions').select('*')
  ]);
  countries=cR.data||[];
  settings={};(sR.data||[]).forEach(r=>settings[r.key]=r.value);
  allVotes={};(vR.data||[]).forEach(v=>{if(!allVotes[v.user_name])allVotes[v.user_name]={};allVotes[v.user_name][v.country_id]=v});
  myVotes=me?(allVotes[me]||{}):{};
  predictions={};(pR.data||[]).forEach(p=>predictions[p.user_name]=p.picks);
  try{off5=JSON.parse(settings.official_top5||'[]')}catch(e){off5=[]}

  /* patch missing flags */
  for(const c of countries){
    if(!c.flag&&ISO[c.name]){c.flag='emoji';sb.from('esc_countries').update({flag:ISO[c.name]}).eq('id',c.id)}
  }

  _mode=settings.app_mode||'vote';

  if(!me){buildLogin();return}
  applyMode(true);
  startPolling();
}

/* ═══════════════════════════════
   POLLING — check mode every 1.5s
═══════════════════════════════ */
let _pollTimer=null;
function startPolling(){
  clearInterval(_pollTimer);
  _pollTimer=setInterval(async()=>{
    const{data}=await sb.from('esc_settings').select('*');
    if(!data)return;
    const newSettings={};
    data.forEach(r=>newSettings[r.key]=r.value);
    const newMode=newSettings.app_mode||'vote';
    const newIdx=parseInt(newSettings.reveal_index||'-1');
    const newPhase=newSettings.reveal_phase||'song';
    const newSummary=newSettings.reveal_summary==='true';

    /* MODE CHANGED → reload page for everyone */
    if(newMode!==_mode){
      _mode=newMode;
      settings=newSettings;
      try{off5=JSON.parse(settings.official_top5||'[]')}catch(e){off5=[]}
      applyMode(false);
      return;
    }

    /* REVEAL STATE CHANGED → update reveal screen for non-admin */
    if(newMode==='reveal'&&me!==ADMIN){
      if(newIdx!==_ri||newPhase!==_rph||newSummary!==_summary){
        _ri=newIdx;_rph=newPhase;_summary=newSummary;
        _rd=calcRes(_rph);
        const rv=$('s-rev');
        if(rv)renderRev(rv);
      }
    }

    settings=newSettings;

    /* refresh votes + predictions every poll tick for everyone */
    const[vR2,pR2]=await Promise.all([
      sb.from('esc_votes').select('*'),
      sb.from('esc_predictions').select('*')
    ]);
    const newAllVotes={};
    (vR2.data||[]).forEach(v=>{if(!newAllVotes[v.user_name])newAllVotes[v.user_name]={};newAllVotes[v.user_name][v.country_id]=v});
    const newPreds={};
    (pR2.data||[]).forEach(p=>newPreds[p.user_name]=p.picks);
    /* check if data changed — if so update and refresh main screen */
    const vChanged=JSON.stringify(newAllVotes)!==JSON.stringify(allVotes);
    const pChanged=JSON.stringify(newPreds)!==JSON.stringify(predictions);
    allVotes=newAllVotes;
    myVotes=me?(allVotes[me]||{}):{};
    predictions=newPreds;
    try{off5=JSON.parse(settings.official_top5||'[]')}catch(e){off5=[]}
    if((vChanged||pChanged)&&newMode==='vote'&&$('s-main')){
      /* silently rebuild main screen to show fresh data */
      buildMain();
    }
  },1500);
}

/* ═══════════════════════════════
   APPLY MODE
═══════════════════════════════ */
function applyMode(isInit){
  if(_mode==='vote'){
    /* everyone sees main screen */
    remScreen('s-rev');remScreen('s-pred-rev');
    buildMain();
  } else if(_mode==='reveal'){
    /* everyone auto-opens reveal */
    _rph=settings.reveal_phase||'song';
    _ri=parseInt(settings.reveal_index||'-1');
    _rd=calcRes(_rph);
    remScreen('s-main');
    buildRevScreen();
  } else if(_mode==='predict'){
    /* everyone auto-opens predict reveal */
    remScreen('s-rev');
    buildPredRevScreen();
  }
}

/* ═══════════════════════════════
   SET MODE (admin only)
═══════════════════════════════ */
async function setMode(mode,extra){
  _mode=mode;
  settings.app_mode=mode;
  const upserts=[{key:'app_mode',value:mode}];
  if(extra)Object.entries(extra).forEach(([k,v])=>{settings[k]=v;upserts.push({key:k,value:String(v)})});
  for(const u of upserts){
    await sb.from('esc_settings').upsert(u,{onConflict:'key'});
  }
}

/* ═══════════════════════════════
   LOGIN
═══════════════════════════════ */
function buildLogin(){
  remScreen('s-login');
  const div=document.createElement('div');div.className='screen active';div.id='s-login';
  const known=Object.keys(allVotes).filter(u=>u!==ADMIN);
  div.innerHTML=
    '<div style="background:var(--dark);padding:52px 16px 28px;text-align:center;flex-shrink:0;">'+
      '<svg width="52" height="48" viewBox="0 0 100 90" style="display:block;margin:0 auto 12px;"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#469B88"/><stop offset="40%" stop-color="#E78C9D"/><stop offset="100%" stop-color="#EED868"/></linearGradient></defs><path d="M50 82C50 82 5 52 5 28C5 15 15 5 28 5C37 5 45 10 50 18C55 10 63 5 72 5C85 5 95 15 95 28C95 52 50 82 50 82Z" fill="url(#hg)"/></svg>'+
      '<div class="h2" style="color:#fff;font-size:22px;">Eurovision 2026</div>'+
      '<div class="sm" style="color:rgba(255,255,255,.45);margin-top:3px;">Vienna · United by Music</div>'+
    '</div>'+
    '<div class="pad" style="padding-top:20px;">'+
      '<div class="xs" style="margin-bottom:6px;">Твоё имя</div>'+
      '<div class="card" style="padding:0;margin-bottom:12px;"><input id="li" type="text" placeholder="Введи имя..." maxlength="20" style="width:100%;padding:13px 14px;border:none;border-radius:var(--r);font-size:16px;font-weight:600;font-family:\'Plus Jakarta Sans\',sans-serif;color:var(--dark);background:var(--card);outline:none;"></div>'+
      (known.length?'<div class="xs" style="margin-bottom:7px;">Или выбери:</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;">'+known.map(u=>'<div class="pill pill-lt" style="cursor:pointer;" onclick="qLogin(\''+esc(u)+'\')">'+esc(u)+'</div>').join('')+'</div>':'')+
      '<button class="btn btn-dk" onclick="doLogin()">Войти →</button>'+
    '</div>';
  $('screens').appendChild(div);
  setTimeout(()=>{const i=$('li');if(i)i.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()})},100);
}

function qLogin(name){me=name;localStorage.setItem('esc_user',name);myVotes=allVotes[name]||{};remScreen('s-login');applyMode(true);startPolling()}
function doLogin(){const n=($('li')?.value||'').trim();if(!n){toast('Введи имя!');return}qLogin(n)}
function logout(){me=null;myVotes={};localStorage.removeItem('esc_user');clearInterval(_pollTimer);remScreen('s-main');buildLogin()}

/* ═══════════════════════════════
   MAIN SCREEN
═══════════════════════════════ */
function buildMain(){
  remScreen('s-main');
  const div=document.createElement('div');div.className='screen active';div.id='s-main';
  const isAdm=me===ADMIN;
  const voted=Object.keys(myVotes).map(cid=>{const c=countries.find(x=>String(x.id)===String(cid));return c?{...c,vote:myVotes[cid]}:null}).filter(Boolean).sort((a,b)=>(b.vote.song_score+b.vote.show_score)-(a.vote.song_score+a.vote.show_score));
  const tv=voted.length,tc=countries.length,hp=!!predictions[me],pct=tc?Math.round(tv/tc*100):0;

  div.innerHTML=
    '<div class="abar">'+
      '<div style="display:flex;align-items:center;gap:9px;">'+
        '<div class="av">'+esc(me.charAt(0).toUpperCase())+'</div>'+
        '<div><div class="xs">Добро пожаловать!</div><div class="h3">'+esc(me)+'</div></div>'+
      '</div>'+
      '<div style="display:flex;gap:6px;align-items:center;">'+
        (isAdm?'<div class="pill pill-y" style="cursor:pointer;font-size:10px;" onclick="buildAdmin()">⚙ Админ</div>':'')+
        '<div style="font-size:12px;color:var(--light);cursor:pointer;" onclick="logout()">Выйти</div>'+
      '</div>'+
    '</div>'+
    '<div class="pad">'+
    /* hero */
    '<div class="card-dark">'+
      '<div style="position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:var(--blue);opacity:.18;"></div>'+
      '<div style="position:absolute;bottom:-15px;left:-15px;width:60px;height:60px;border-radius:50%;background:var(--teal);opacity:.15;"></div>'+
      '<div class="xs" style="color:rgba(255,255,255,.4);margin-bottom:4px;">ПРОГОЛОСОВАНО</div>'+
      '<div class="h1" style="color:#fff;font-size:34px;letter-spacing:-1px;">'+tv+'<span style="font-size:18px;opacity:.4;"> / '+tc+'</span></div>'+
      '<div class="sm" style="color:rgba(255,255,255,.4);margin-bottom:10px;">стран оценено</div>'+
      '<div class="prog"><div class="prog-f" style="width:'+pct+'%;"></div></div>'+
      '<div style="font-size:10px;color:rgba(255,255,255,.3);margin-top:4px;">'+pct+'% завершено</div>'+
    '</div>'+
    /* actions */

function selC(id){
  const c=countries.find(x=>x.id===id);if(!c)return;

      '<div class="sl-thumb" id="ht" style="left:calc('+(_hs*20)+'% - 10px);"></div>'+
      '<input type="range" min="0" max="50" step="1" value="'+Math.round(_hs*10)+'" class="sl-range" oninput="upd(\'show\',this.value)"></div>'+

    '</div>'+

function upd(t,v){
  const val=v/10;
  if(t==='song'){_ss=val;const s=$('sv'),f=$('sf'),th=$('st');if(s)s.textContent=val.toFixed(1);if(f)f.style.width=(val*20)+'%';if(th)th.style.left='calc('+(val*20)+'% - 10px)'}
  else{_hs=val;const s=$('hv'),f=$('hf'),th=$('ht');if(s)s.textContent=val.toFixed(1);if(f)f.style.width=(val*20)+'%';if(th)th.style.left='calc('+(val*20)+'% - 10px)'}
  const av=$('av');if(av)av.textContent=((_ss+_hs)/2).toFixed(1);
}

async function saveVote(){
  if(!_sc)return;
  const btn=$('svb');if(btn){btn.disabled=true;btn.textContent='Сохранение...'}
  const vote={user_name:me,country_id:_sc.id,song_score:_ss,show_score:_hs};
  const{error}=await sb.from('esc_votes').upsert(vote,{onConflict:'user_name,country_id'});
  if(error){toast('Ошибка сохранения');if(btn){btn.disabled=false;btn.textContent='Сохранить оценку'}return}
  if(!allVotes[me])allVotes[me]={};
  allVotes[me][_sc.id]=vote;myVotes=allVotes[me];
  closeSheet();toast(_sc.name+' — оценка сохранена!');
  remScreen('s-main');buildMain();
}

async function savePred(){

const phLbl={song:'🎵 Топ-5 по ПЕСНЕ',show:'🎭 Топ-5 по НОМЕРУ',total:'🏆 Общий победитель'};
const phBg={song:'var(--coral)',show:'var(--rose)',total:'var(--blue)'};

function calcRes(ph){
  const s={};countries.forEach(c=>{s[c.id]={country:c,total:0,count:0,voters:{}}});
  Object.entries(allVotes).forEach(([u,uv])=>{Object.entries(uv).forEach(([cid,v])=>{if(!s[cid])return;const val=ph==='song'?v.song_score:ph==='show'?v.show_score:(v.song_score+v.show_score);s[cid].total+=val;s[cid].count+=1;s[cid].voters[u]=ph==='total'?((v.song_score+v.show_score)/2).toFixed(1):(ph==='song'?v.song_score:v.show_score)})});
  return Object.values(s).filter(x=>x.count>0).sort((a,b)=>(b.total/b.count)-(a.total/a.count)).slice(0,5).reverse();
}

function buildRevScreen(){
  remScreen('s-rev');
  const div=document.createElement('div');div.className='screen active';div.id='s-rev';
  $('screens').appendChild(div);renderRev(div);setScreen('s-rev');
}

      '<div style="background:rgba(255,255,255,.9);border-radius:8px;display:inline-block;padding:8px 20px;">'+
        '<div class="xs" style="color:var(--muted);">СРЕДНИЙ БАЛЛ</div>'+
        '<div style="font-family:\'Plus Jakarta Sans\',sans-serif;font-size:26px;font-weight:700;color:'+bg+';letter-spacing:-1px;">'+avg+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="card" style="margin-bottom:10px;">'+
      '<div class="xs" style="margin-bottom:8px;">ОЦЕНКИ УЧАСТНИКОВ</div>'+
      Object.entries(item.voters).map(([u,sc])=>
        '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);">'+
          '<div style="width:26px;height:26px;border-radius:7px;background:'+bg+';display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;font-family:\'Plus Jakarta Sans\',sans-serif;flex-shrink:0;">'+esc(u.charAt(0).toUpperCase())+'</div>'+
          '<div class="sm" style="font-weight:600;flex:1;">'+esc(u)+'</div>'+
          '<div style="font-size:13px;font-weight:700;color:'+bg+';font-family:\'Plus Jakarta Sans\',sans-serif;">'+sc+'</div>'+
        '</div>'
      ).join('')+
    '</div>'+
    /* admin: next button. non-admin: show back only at end */
    (isAdm?
      '<button class="btn btn-dk" onclick="rnext()">'+(last&&_rph==='total'?'🎊 Завершить!':last?'▶ Следующая категория':'▶ Следующее место')+'</button>':
      (last&&_rph==='total'?'<button class="btn btn-out" onclick="goBack()">← Назад</button>':'<div style="text-align:center;padding:10px;font-size:13px;color:var(--muted);">Ждём следующего места...</div>')+
    '')+
    '</div>';

  if(place===1)confetti();
}

async function rnext(){
  /* if on summary screen — move to next phase */
  if(_summary){
    _summary=false;
    if(_rph==='song'){_rph='show';_rd=calcRes('show')}
    else if(_rph==='show'){_rph='total';_rd=calcRes('total')}
    else{await setMode('vote');applyMode(false);return;}
    _ri=-1;
    await sb.from('esc_settings').upsert({key:'reveal_index',value:'-1'},{onConflict:'key'});
    await sb.from('esc_settings').upsert({key:'reveal_phase',value:_rph},{onConflict:'key'});
    await sb.from('esc_settings').upsert({key:'reveal_summary',value:'false'},{onConflict:'key'});
    settings.reveal_index='-1';settings.reveal_phase=_rph;settings.reveal_summary='false';
    const rv=$('s-rev');if(rv)renderRev(rv);
    return;
  }

  _ri++;
  /* after last place (index 4 = place 1) — show summary */
  if(_ri>=_rd.length){
    _summary=true;
    await sb.from('esc_settings').upsert({key:'reveal_summary',value:'true'},{onConflict:'key'});
    settings.reveal_summary='true';
    const rv=$('s-rev');if(rv)renderRev(rv);
    return;
  }
  /* save state to DB for others */
  await sb.from('esc_settings').upsert({key:'reveal_index',value:String(_ri)},{onConflict:'key'});
  await sb.from('esc_settings').upsert({key:'reveal_phase',value:_rph},{onConflict:'key'});
  await sb.from('esc_settings').upsert({key:'reveal_summary',value:'false'},{onConflict:'key'});
  settings.reveal_index=String(_ri);settings.reveal_phase=_rph;settings.reveal_summary='false';
  const rv=$('s-rev');if(rv)renderRev(rv);
}

function setRP(p){
  _rph=p;_rd=calcRes(p);_ri=-1;_summary=false;
  const rv=$('s-rev');if(rv)renderRev(rv);
}

function goBack(){
  remScreen('s-rev');remScreen('s-pred-rev');
  buildMain();setScreen('s-main');
}

function confetti(){
  const cols=['#E0533D','#E78C9D','#EED868','#9DA7D0','#469B88','#377CC8'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div'),sz=Math.random()*8+4;
    el.style.cssText='position:fixed;pointer-events:none;z-index:999;border-radius:2px;left:'+Math.random()*100+'%;width:'+sz+'px;height:'+sz*.6+'px;background:'+cols[Math.floor(Math.random()*cols.length)]+';animation:cfFall '+(Math.random()*2+1.5)+'s linear '+Math.random()*.5+'s forwards';
    document.body.appendChild(el);setTimeout(()=>el.remove(),3000);
  }
}

/* ═══════════════════════════════
   PREDICT REVEAL SCREEN
═══════════════════════════════ */
function buildPredRevScreen(){
  remScreen('s-pred-rev');
  const div=document.createElement('div');div.className='screen active';div.id='s-pred-rev';
  $('screens').appendChild(div);renderPredRev(div);setScreen('s-pred-rev');
}

function renderPredRev(div){
  const users=Object.keys(predictions);
  const hasOff=off5.filter(Boolean).length===5;

  /* scoring: exact place=1.0, off by 1=0.5, off by 2=0.25, off by 3+=0 */
  function pointsForPick(cid,pickPos){
    if(!hasOff)return 0;
    const realPos=off5.findIndex(x=>String(x)===String(cid));
    if(realPos===-1)return 0; /* not in top5 at all */
    const diff=Math.abs(realPos-pickPos);
    if(diff===0)return 1.0;
    if(diff===1)return 0.5;
    if(diff===2)return 0.25;
    return 0;
  }

  function score(picks){
    if(!hasOff)return 0;
    return picks.filter(Boolean).reduce((sum,cid,i)=>sum+pointsForPick(cid,i),0);
  }

  const scored=users.map(u=>({u,sc:Math.round(score(predictions[u]||[])*100)/100})).sort((a,b)=>b.sc-a.sc);
  const maxSc=scored.length?scored[0].sc:0;
  const winners=scored.filter(x=>x.sc===maxSc&&x.sc>0).map(x=>x.u);

  div.innerHTML=
    '<div class="abar-sm">'+
      '<button onclick="goBack();" style="background:var(--card);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;font-size:18px;cursor:pointer;color:var(--dark);display:flex;align-items:center;justify-content:center;">‹</button>'+
      '<div><div class="h3">🔮 Предикты</div><div class="sm">'+users.length+' участников</div></div>'+
    '</div>'+
    '<div class="pad">'+

    /* official top5 */
    (hasOff?
      '<div class="xs" style="margin-bottom:8px;">ОФИЦИАЛЬНЫЙ РЕЗУЛЬТАТ EUROVISION</div>'+
      '<div class="card" style="padding:0 14px;margin-bottom:12px;">'+
      off5.map((cid,i)=>{
        const c=countries.find(x=>String(x.id)===String(cid));if(!c)return'';
        const med=['🥇','🥈','🥉','4️⃣','5️⃣'];
        return'<div class="row" style="padding:8px 0;"><div style="font-size:18px;width:26px;">'+med[i]+'</div>'+flagEl(c.name,'sm')+'<div class="h3" style="font-size:14px;">'+esc(c.name)+'</div></div>';
      }).join('')+
      '</div>' : '')+

    /* winner */
    (hasOff&&winners.length?
      '<div class="winner">'+
        '<div class="xs" style="color:rgba(0,0,0,.5);margin-bottom:4px;">🏆 ЛУЧШИЙ ПРЕДИКТ</div>'+
        '<div style="font-size:20px;font-weight:800;color:var(--dark);">'+winners.map(w=>esc(w)).join(', ')+'</div>'+
        '<div style="font-size:13px;color:rgba(0,0,0,.5);margin-top:2px;">'+maxSc+' баллов из 5</div>'+
      '</div>' : '')+

    /* user predictions */
    '<div class="xs" style="margin:4px 0 8px;">ПРЕДИКТЫ УЧАСТНИКОВ</div>'+
    (users.length?scored.map(({u,sc})=>{
      const pks=predictions[u]||[];
      return'<div class="card" style="margin-bottom:8px;">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">'+
          '<div class="av" style="font-size:13px;">'+esc(u.charAt(0).toUpperCase())+'</div>'+
          '<div class="h3" style="font-size:14px;flex:1;">'+esc(u)+'</div>'+
          (hasOff?'<div style="background:var(--ok);color:#fff;border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700;">'+sc+' / 5 pts</div>':'')+
        '</div>'+
        pks.filter(Boolean).map((cid,i)=>{
          const c=countries.find(x=>String(x.id)===String(cid));if(!c)return'';
          const pts=hasOff?pointsForPick(cid,i):null;
          const isExact=pts===1.0;
          const isPartial=pts>0&&pts<1;
          const isNone=hasOff&&pts===0;
          const rowBg=isExact?'match':isPartial?'partial-match':isNone?'no-match':'';
          const ptLabel=pts===1?'✓ +1':pts===0.5?'+0.5':pts===0.25?'+0.25':'';
          const ptColor=isExact?'var(--ok)':isPartial?'var(--blue)':'var(--light)';
          return'<div class="row '+rowBg+'" style="padding:8px '+(rowBg&&rowBg!=='no-match'?'10px':'0')+';border-radius:'+(rowBg&&rowBg!=='no-match'?'var(--r)':'0')+';">'+
            '<div style="font-size:11px;font-weight:700;color:var(--muted);width:18px;text-align:center;">'+(i+1)+'</div>'+
            flagEl(c.name,'sm')+
            '<div style="flex:1;"><div class="h3" style="font-size:13px;">'+esc(c.name)+'</div></div>'+
            (hasOff&&ptLabel?'<div style="font-size:12px;font-weight:700;color:'+ptColor+';">'+ptLabel+'</div>':'')+
          '</div>';
        }).join('')+
      '</div>';
    }).join(''):
    '<div class="card" style="text-align:center;padding:24px;color:var(--light);">Предиктов пока нет</div>')+
    '</div>';
}

/* ═══════════════════════════════
   ADMIN SCREEN
═══════════════════════════════ */
function buildAdmin(){
  remScreen('s-adm');
  const div=document.createElement('div');div.className='screen active';div.id='s-adm';
  $('screens').appendChild(div);renderAdm(div);setScreen('s-adm');
}

function renderAdm(c){
  const curMode=settings.app_mode||'vote';
  c.innerHTML=
    '<div class="abar-sm">'+
      '<button onclick="remScreen(\'s-adm\');buildMain();" style="background:var(--card);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;font-size:18px;cursor:pointer;color:var(--dark);display:flex;align-items:center;justify-content:center;">‹</button>'+
      '<div class="h3">Панель администратора</div>'+
    '</div>'+
    '<div class="pad">'+

    /* MODE CONTROL */
    '<div class="adm-sec">'+
      '<div class="adm-ttl">Режим приложения</div>'+
      '<div style="display:flex;flex-direction:column;gap:8px;">'+

        '<div style="background:'+(curMode==='vote'?'var(--teal)':'var(--card)')+';border-radius:var(--r);padding:14px;cursor:pointer;border:2px solid '+(curMode==='vote'?'var(--teal)':'var(--border)')+';" onclick="switchMode(\'vote\')">'+
          '<div style="font-weight:700;color:'+(curMode==='vote'?'#fff':'var(--dark)')+';">🗳 Режим голосования</div>'+
          '<div style="font-size:12px;color:'+(curMode==='vote'?'rgba(255,255,255,.7)':'var(--muted)')+';">Все голосуют и делают предикты</div>'+
        '</div>'+

        '<div style="background:'+(curMode==='reveal'?'var(--coral)':'var(--card)')+';border-radius:var(--r);padding:14px;cursor:pointer;border:2px solid '+(curMode==='reveal'?'var(--coral)':'var(--border)')+';" onclick="switchMode(\'reveal\')">'+
          '<div style="font-weight:700;color:'+(curMode==='reveal'?'#fff':'var(--dark)')+';">🏆 Reveal результатов</div>'+
          '<div style="font-size:12px;color:'+(curMode==='reveal'?'rgba(255,255,255,.7)':'var(--muted)')+';">У всех откроется экран итогов</div>'+
        '</div>'+

        '<div style="background:'+(curMode==='predict'?'var(--lav)':'var(--card)')+';border-radius:var(--r);padding:14px;cursor:pointer;border:2px solid '+(curMode==='predict'?'var(--lav)':'var(--border)')+';" onclick="switchMode(\'predict\')">'+
          '<div style="font-weight:700;color:'+(curMode==='predict'?'#fff':'var(--dark)')+';">🔮 Reveal предиктов</div>'+
          '<div style="font-size:12px;color:'+(curMode==='predict'?'rgba(255,255,255,.7)':'var(--muted)')+';">У всех откроется экран предиктов</div>'+
        '</div>'+

      '</div>'+
    '</div>'+

    /* OFFICIAL TOP5 */
    '<div class="adm-sec">'+
      '<div class="adm-ttl">Официальный топ-5 Eurovision</div>'+
      '<div id="off5-slots"></div>'+
      '<button class="btn btn-dk" style="margin-top:4px;padding:11px;" onclick="saveOff5()">Сохранить официальный топ-5</button>'+
    '</div>'+

    /* COUNTRIES */
    '<div class="adm-sec">'+
      '<div class="adm-ttl">Страны финала ('+countries.length+')</div>'+
      '<div id="acl"></div>'+
      '<div class="add-row"><input class="ei" id="nf" placeholder="🏳️" style="width:46px;flex:none;text-align:center;"><input class="ei" id="nn" placeholder="Страна"><input class="ei" id="na" placeholder="Артист"><button class="add-btn" onclick="addC()">+</button></div>'+
    '</div>'+

    /* STATS */
    '<div class="adm-sec">'+
      '<div class="adm-ttl">Статус голосования</div>'+
      Object.keys(allVotes).map(u=>'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;"><span>'+esc(u)+'</span><span class="sm">'+Object.keys(allVotes[u]).length+' / '+countries.length+'</span></div>').join('')+
    '</div>'+
    '</div>';
  renderACL();
  renderOff5Slots();
}

async function switchMode(mode){
  const extra={};
  if(mode==='reveal'){extra.reveal_index='-1';extra.reveal_phase='song';extra.reveal_summary='false';_ri=-1;_rph='song';_rd=calcRes('song');_summary=false;}
  await setMode(mode,extra);
  toast(mode==='vote'?'✅ Режим голосования':mode==='reveal'?'🏆 Reveal запущен!':'🔮 Предикты открыты');
  /* admin navigates to the screen */
  if(mode==='reveal'){remScreen('s-adm');buildRevScreen()}
  else if(mode==='predict'){remScreen('s-adm');buildPredRevScreen()}
  else{remScreen('s-adm');buildMain()}
}

function setOff(i,val){
  while(off5.length<5)off5.push('');
  off5[i]=val?parseInt(val):'';
  /* only re-render the off5 slots, not the whole admin screen */
  renderOff5Slots();
}

function renderOff5Slots(){
  const el=$('off5-slots');
  if(!el)return;
  el.innerHTML=[0,1,2,3,4].map(i=>{
    const cid=String(off5[i]||'');
    const taken=new Set(off5.filter((_,j)=>j!==i).map(x=>String(x||'')).filter(Boolean));
    const selC=cid?countries.find(co=>String(co.id)===cid):null;
    return'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">'+
      '<div style="width:22px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);">'+(i+1)+'</div>'+
      '<select class="ei" onchange="setOff('+i+',this.value)">'+
        '<option value="">— место '+(i+1)+' —</option>'+
        countries.filter(co=>!taken.has(String(co.id))||String(co.id)===cid)
          .map(co=>'<option value="'+co.id+'" '+(String(co.id)===cid?'selected':'')+'>'+co.name+'</option>').join('')+
      '</select>'+
      (selC?flagEl(selC.name,'sm'):'')+
    '</div>';
  }).join('');
}
async function saveOff5(){
  const v=JSON.stringify(off5.map(x=>x||''));
  await sb.from('esc_settings').upsert({key:'official_top5',value:v},{onConflict:'key'});
  settings.official_top5=v;
  toast('Официальный топ-5 сохранён!');
  const adm=$('s-adm');if(adm)renderAdm(adm);
}

function renderACL(){
  const el=$('acl');if(!el)return;
  el.innerHTML=countries.map(c=>'<div class="er"><input class="ei" value="'+esc(c.flag||'')+'" style="width:40px;flex:none;text-align:center;" onchange="updC('+c.id+',\'flag\',this.value)" placeholder="🏳️"><input class="ei" value="'+esc(c.name)+'" onchange="updC('+c.id+',\'name\',this.value)"><input class="ei" value="'+esc(c.artist||'')+'" onchange="updC('+c.id+',\'artist\',this.value)" placeholder="Артист"><button class="del-btn" onclick="delC('+c.id+')">🗑</button></div>').join('');
}

const _ct={};
async function updC(id,f,v){clearTimeout(_ct[id+f]);_ct[id+f]=setTimeout(async()=>{const u={};u[f]=v;await sb.from('esc_countries').update(u).eq('id',id);const c=countries.find(x=>x.id===id);if(c)c[f]=v},700)}
async function addC(){const flag=$('nf').value.trim()||'🏳️',name=$('nn').value.trim(),artist=$('na').value.trim();if(!name){toast('Введи название');return}const{data,error}=await sb.from('esc_countries').insert({flag,name,artist,order_num:countries.length+1}).select().single();if(error){toast('Ошибка');return}countries.push(data);$('nf').value='';$('nn').value='';$('na').value='';renderACL();toast(name+' добавлена!')}
async function delC(id){if(!confirm('Удалить?'))return;await sb.from('esc_votes').delete().eq('country_id',id);await sb.from('esc_countries').delete().eq('id',id);countries=countries.filter(c=>c.id!==id);renderACL();toast('Удалено')}

init();
</script>
